<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página en construcción</title>

    <!-- Favicons -->
    <link href="assets/img/favicon_io/favicon.ico" rel="icon" />
    <link href="assets/img/favicon_io/apple-touch-icon.png" rel="apple-touch-icon" />

    <style>
      /* ===== Paleta ===== */
      :root{
        --rosa-nude:#eac6c0;
        --rosa-tiza:#f4e2de;
        --marron-claro:#a98274;
        --tostado:#c8a79e;
        --chocolate-suave:#5f4b3b;
        --blanco-hueso:#faf8f6;

        --space-1:8px; --space-2:12px; --space-3:16px; --space-4:24px;
        --radius:16px;
      }

      *{ box-sizing:border-box }

      body{
        margin:0;
        font-family:system-ui, -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif;
        color:var(--chocolate-suave);
        background:#f7f6f5;
        min-height:100svh;                /* altura segura en móviles */
        display:flex;
      }

      /* Contenedor fluido */
      .container{
        width:100%;
        max-width:980px;
        margin:0 auto;
        padding:clamp(16px, 4vw, 40px);
        display:flex;
        flex-direction:column;
        gap:clamp(16px, 4vw, 32px);
      }

      /* Tarjeta central */
      .card{
        background:var(--blanco-hueso);
        border:1px solid var(--tostado);
        border-radius:var(--radius);
        padding:clamp(16px, 4.5vw, 36px);
        box-shadow:0 6px 20px rgba(0,0,0,.06);
        text-align:center;
      }

      h1{
        margin:0 0 var(--space-3);
        color:var(--marron-claro);
        font-weight:800;
        font-size:clamp(24px, 6vw, 40px);
        letter-spacing:.2px;
      }

      p{
        margin:0 0 var(--space-4);
        font-size:clamp(14px, 3.8vw, 18px);
        line-height:1.6;
      }

      a{
        color:inherit;
        text-decoration:none;
        border-bottom:1px dotted currentColor;
        word-break:break-word; /* por si el dominio se corta */
      }

      /* Paleta en grilla auto-ajustable */
      .palette{
        display:grid;
        grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
        gap:clamp(10px, 2.5vw, 20px);
      }

      .color{
        background:#fff;
        border:1px solid #eee2dc;
        border-radius:14px;
        overflow:hidden;
        box-shadow:0 3px 10px rgba(0,0,0,.05);
        display:flex;
        flex-direction:column;
        min-height:120px;
      }

      .swatch{ flex:1; }
      .info{ padding:10px 12px; font-size:13px }

      footer{
        text-align:center;
        font-size:12px;
        opacity:.85;
      }

      /* Pequeños toques para pantallas muy anchas */
      @media (min-width:1200px){
        .palette{ grid-template-columns:repeat(6, 1fr); }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <section class="card">
        <h1>Página en construcción</h1>
        <p>
          Estamos trabajando en el nuevo sitio de
          <strong>Somos Grupo de Mujeres Más</strong>. Pronto vas a poder conocer
          más sobre nosotras.
        </p>
        <p><a href="https://www.somosgrupodemujeresmas.ar" rel="noopener">www.somosgrupodemujeresmas.ar</a></p>
      </section>
