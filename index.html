<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página en construcción</title>
  <style>
    /* Paleta de colores */
    :root {
      --rosa-nude: #EAC6C0;
      --rosa-tiza: #F4E2DE;
      --marron-claro: #A98274;
      --tostado: #C8A79E;
      --chocolate-suave: #5F4B3B;
      --blanco-hueso: #FAF8F6;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--rosa-tiza);
      color: var(--chocolate-suave);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      color: var(--marron-claro);
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      color: var(--chocolate-suave);
      max-width: 600px;
    }

    .box {
      background-color: var(--blanco-hueso);
      padding: 40px 60px;
      border-radius: 12px;
      border: 2px solid var(--tostado);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: var(--marron-claro);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Página en construcción</h1>
    <p>Estamos trabajando en el nuevo sitio de <strong>Somos Grupo de Mujeres Mas</strong>.  
    Pronto vas a poder conocer más sobre nosotras.</p>
  </div>

  <div class="footer">
    © 2025 Somos Grupo de Mujeres Mas
  </div>
</body>
</html>
